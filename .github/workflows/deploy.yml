name: Deploy Channels (SST)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "24"
  SST_STAGE: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configure this GitHub Environment with required reviewer approval.
    # Production credentials should be scoped to this environment.
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ secrets.INFISICAL_ENV_SLUG }}
          export-type: "env"
          secret-path: "/"
          oidc-audience: "https://github.com/sd2389"

      - name: Assert required Channels secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DATABASE_URL CHANNELS_SERVICE_TOKEN DEVJEWELS_API_BASE_URL AWS_SECURITY_GROUP_IDS; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required production configuration: $key"
              missing=1
            fi
          done
          if [ -z "${AWS_SUBNET_IDS:-}${AWS_PRIVATE_SUBNET_IDS:-}" ]; then
            echo "Missing required production subnet configuration"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ -z "${CHANNELS_ENQUEUE_SKELETON_ON_UNMAPPED:-}" ]; then
            echo "CHANNELS_ENQUEUE_SKELETON_ON_UNMAPPED=0" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS Credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy with SST
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: npx sst deploy --stage production

      - name: Notify SNS on deploy failure
        if: failure()
        env:
          SNS_TOPIC: ${{ secrets.SNS_DEPLOY_TOPIC_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SNS_TOPIC:-}" ]; then
            echo "SNS deploy topic is not configured; skipping notification."
            exit 0
          fi
          aws sns publish \
            --topic-arn "$SNS_TOPIC" \
            --subject "DevJewels Channels Deploy FAILED" \
            --message "Channels production deploy failed for commit ${{ github.sha }} on branch ${{ github.ref_name }}. Check the GitHub Actions run for details." \
            --region ${{ secrets.AWS_REGION }}

      - name: Notify SNS on deploy success
        if: success()
        env:
          SNS_TOPIC: ${{ secrets.SNS_DEPLOY_TOPIC_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SNS_TOPIC:-}" ]; then
            echo "SNS deploy topic is not configured; skipping notification."
            exit 0
          fi
          aws sns publish \
            --topic-arn "$SNS_TOPIC" \
            --subject "DevJewels Channels Deploy SUCCESS" \
            --message "Channels production deploy succeeded for commit ${{ github.sha }} on branch ${{ github.ref_name }}." \
            --region ${{ secrets.AWS_REGION }}
